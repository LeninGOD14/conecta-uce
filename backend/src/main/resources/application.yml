server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: conectauce-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/conectauce}
    username: ${DB_USER:conectauce}
    password: ${DB_PASSWORD:conectauce_local_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}

logging:
  level:
    com.conectauce: INFO
