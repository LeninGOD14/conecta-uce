name: Frontend CI

on:
  push:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - '.github/workflows/frontend-ci.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - run: npm install
      - run: npm run build:web
      - run: npm run typecheck:mobile
