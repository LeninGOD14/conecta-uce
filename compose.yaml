services:
  postgres:
    image: postgres:17-alpine
    container_name: conectauce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conectauce}
      POSTGRES_USER: ${POSTGRES_USER:-conectauce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conectauce_local_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - conectauce_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conectauce} -d ${POSTGRES_DB:-conectauce}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  conectauce_postgres_data:
